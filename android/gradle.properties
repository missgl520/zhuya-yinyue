# Gradle / Android 构建属性配置

# JVM 参数：最大堆内存 8G、Metaspace 4G、代码缓存 512m
# 内存溢出时生成堆转储文件，便于排查 OOM
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# 启用 AndroidX 支持库
android.useAndroidX=true

# Flutter 模板生成的标志：是否使用新 DSL（当前关闭）
android.newDsl=false

# Flutter 模板生成的标志：是否使用内置 Kotlin（当前关闭）
android.builtInKotlin=false

# 项目位于中文路径（F:\竹笌音乐狗\）下，绕过 Android Gradle 插件对非 ASCII 路径的拦截
android.overridePathCheck=true
