# GitHub Actions 工作流：构建竹芽 Android APK
name: Build APK

on:
  push:
    branches: [qianduan]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 缓存 Gradle（减少重复下载）
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-v2

      # pub.dev 国内慢，需要镜像；Flutter 引擎二进制从 Google Storage 直下（CI 在美国，直连快）
      - name: Configure pub mirror
        run: |
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> $GITHUB_ENV

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Analyze (static checks)
        run: flutter analyze

      # 修复 flutter_live2d 硬编码的 CMake 3.10.2 版本（AGP 9 需要更高版本）
      - name: Patch flutter_live2d CMake version
        run: |
          set -e
          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          GRADLE_FILE=$(find "$PUB_CACHE" -path "*flutter_live2d-1.0.2/android/build.gradle.kts" 2>/dev/null | head -1)
          echo "Found gradle file: $GRADLE_FILE"
          if [ -n "$GRADLE_FILE" ] && grep -q 'version = "3\.10\.2"' "$GRADLE_FILE"; then
            sed -i 's/version = "3\.10\.2"/version = "3.22.1"/' "$GRADLE_FILE"
            echo "✅ CMake version patched to 3.22.1"
          else
            echo "⚠️  CMake already patched or file not found, skipping"
          fi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: zhuyapp-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
